name: Security

on:
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # weekly, Monday 06:00 UTC — catches newly disclosed CVEs against unchanged deps
  workflow_dispatch:

permissions:
  contents: read

jobs:
  filesystem:
    name: Dependency, secret & IaC scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,config
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          skip-dirs: '**/node_modules,**/dist,**/build,**/coverage'
          exit-code: '1'

  backend-image:
    name: Backend image scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f backend/Dockerfile -t youtube-clone-backend:ci .

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: youtube-clone-backend:ci
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
